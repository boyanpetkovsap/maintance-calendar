<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1440" />
<title>Calendar – SAP for Me</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f6f7;
    --white: #ffffff;
    --brand: #0070f2;
    --link: #0064d9;
    --text: #1d2d3e;
    --text2: #131e29;
    --label: #556b82;
    --border: #e5e5e5;
    --border2: #d9d9d9;
    --group-border: #a8b3bd;
    --field-border: #8a97a4;
    --shell-interactive: #eff1f2;
    --hover: #f2f6fb;
    --sel-bg: #ebf5ff;
    --badge: #aa0808;
    --red: #bb0000;
    --weekend: #f7f8f9;
  }

  html, body { height: 100%; }
  body {
    font-family: "72", "72override", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text2);
    background: var(--bg);
    font-size: 14px;
    line-height: 1.3;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  a { color: var(--link); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  /* ===== Shell bar ===== */
  .shellbar {
    height: 44px; background: var(--white); border-bottom: 1px solid var(--border2);
    display: flex; align-items: center; padding: 0 16px; gap: 12px;
    position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 2px #556b821a;
  }
  .shellbar .logo {
    width: 44px; height: 22px; background: var(--brand); border-radius: 3px;
    display: flex; align-items: center; justify-content: center; color: #fff;
    font-weight: 900; font-size: 13px; letter-spacing: .5px; transform: skewX(-10deg);
  }
  .shellbar .logo span { transform: skewX(10deg); }
  .shellbar .product { font-weight: 700; color: var(--text); font-size: 15px; }
  .shellbar .search { flex: 1; max-width: 560px; margin: 0 auto; position: relative; }
  .shellbar .search input {
    width: 100%; height: 30px; border-radius: 16px; border: 1px solid transparent;
    background: var(--shell-interactive); padding: 0 36px 0 16px; font-size: 13px; color: var(--text);
  }
  .shellbar .search input::placeholder { color: var(--label); }
  .shellbar .search .s-icon { position: absolute; right: 12px; top: 7px; color: var(--label); }
  .shell-right { display: flex; align-items: center; gap: 14px; margin-left: auto; }
  .shell-right .explore { color: var(--text); font-size: 13px; }
  .shell-btn { position: relative; color: var(--text); background: none; border: none; padding: 4px; border-radius: 6px; display: flex; }
  .shell-btn:hover { background: var(--shell-interactive); }
  .badge {
    position: absolute; top: -6px; right: -8px; background: var(--badge); color: #fff;
    border-radius: 10px; font-size: 10px; font-weight: 700; padding: 1px 5px; min-width: 18px; text-align: center;
  }
  .avatar { width: 30px; height: 30px; border-radius: 50%; overflow: hidden; }

  /* ===== Body layout ===== */
  .body { display: flex; min-height: calc(100vh - 44px); }
  .nav {
    width: 208px; flex: 0 0 208px; background: var(--white); border-right: 1px solid var(--border2);
    display: flex; flex-direction: column; padding: 8px 0; position: sticky; top: 44px; height: calc(100vh - 44px);
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 8px 16px; color: var(--text); font-size: 13px;
    cursor: pointer; position: relative; border: none; background: none; width: 100%; text-align: left; font-weight: 600;
  }
  .nav-item:hover { background: var(--hover); }
  .nav-item.active { background: var(--sel-bg); }
  .nav-item.active::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; background: var(--brand); border-radius: 0 2px 2px 0; }
  .nav-section { padding: 14px 16px 4px; font-size: 11px; color: var(--label); font-weight: 400; }
  .nav-spacer { flex: 1; }
  .nav-item .chev-r { margin-left: auto; color: var(--label); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* ===== Page header ===== */
  .page-header { background: var(--white); padding: 14px 32px 0; border-bottom: 1px solid var(--border); }
  .ph-top { display: flex; align-items: center; gap: 12px; }
  .ph-title { font-size: 22px; font-weight: 800; color: var(--text); }
  .ph-sep { color: var(--border2); font-weight: 300; }

  /* ===== Customer hierarchy selector ===== */
  .company-wrap { position: relative; }
  .company-select {
    display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); font-weight: 400;
    background: none; border: none; padding: 4px 6px; border-radius: 6px;
  }
  .company-select:hover { background: var(--hover); }
  .company-select .under { border-bottom: 1px solid var(--border2); padding-bottom: 2px; }
  .company-select .chev { display: inline-flex; color: #758ca4; transition: transform .15s; }
  .company-select.open .chev { transform: rotate(180deg); }
  .company-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 50; list-style: none;
    background: var(--white); border: 1px solid var(--border2); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(34,54,84,.16); padding: 6px; min-width: 230px;
  }
  .company-menu li { display: block; }
  .company-menu button {
    display: block; width: 100%; text-align: left; background: none; border: none;
    font: inherit; font-size: 14px; color: var(--text); padding: 11px 14px; border-radius: 6px; cursor: pointer;
  }
  .company-menu button:hover { background: var(--hover); }
  .company-menu button[aria-selected="true"] { font-weight: 600; background: var(--sel-bg); }
  .company-backdrop { position: fixed; inset: 0; z-index: 40; }
  .ph-assist { margin-left: auto; }
  .btn-ghost-outline {
    border: 1px solid var(--link); color: var(--link); background: var(--white); border-radius: 8px;
    height: 30px; padding: 0 14px; font-size: 13px; font-weight: 600;
  }
  .btn-ghost-outline:hover { background: #f0f7ff; }

  .tabs { display: flex; gap: 26px; margin-top: 14px; }
  .tab {
    padding: 10px 0 12px; font-size: 14px; color: #475e75; font-weight: 600; background: none; border: none;
    border-bottom: 3px solid transparent; position: relative; top: 1px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--brand); border-bottom-color: var(--brand); }

  /* ===== Content / card ===== */
  .content { padding: 20px 32px 48px; }
  .card { background: var(--white); border-radius: 12px; box-shadow: 0 2px 4px #22364922, 0 0 2px #22364922; overflow: visible; }

  /* ===== Calendar toolbar ===== */
  .cal-toolbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .cal-date { font-size: 15px; font-weight: 700; color: var(--text); }
  .spacer { flex: 1; }
  .btn-primary { background: var(--link); color: #fff; border: none; border-radius: 8px; height: 32px; padding: 0 14px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary:hover { background: #0054b8; }
  .chk { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text2); }
  .chk input { width: 15px; height: 15px; accent-color: var(--link); }
  .tb-search { position: relative; width: 170px; }
  .tb-search input { width: 100%; height: 30px; border-radius: 16px; border: 1px solid var(--field-border); background: #fff; padding: 0 32px 0 12px; font-size: 13px; }
  .tb-search .s-icon { position: absolute; right: 10px; top: 7px; color: var(--label); }
  .seg { display: inline-flex; border: 1px solid var(--field-border); border-radius: 6px; overflow: hidden; }
  .seg button { background: #fff; border: none; color: var(--text); font-size: 13px; font-weight: 600; padding: 5px 12px; border-right: 1px solid var(--field-border); }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: var(--sel-bg); color: var(--link); }
  .today-btn { height: 30px; border: 1px solid var(--field-border); border-radius: 6px; background: #fff; color: var(--text); font-size: 13px; font-weight: 600; padding: 0 14px; }
  .today-btn:hover { background: var(--hover); }
  .icon-btn { background: none; border: none; color: var(--link); padding: 6px; border-radius: 6px; display: inline-flex; }
  .icon-btn:hover { background: #eef5fe; }
  .tb-sep { width: 1px; height: 22px; background: var(--border2); }
  .tb-toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); }

  /* ===== Switch ===== */
  .sw { width: 38px; height: 22px; border-radius: 11px; background: #c9d0d8; position: relative; transition: .15s; border: none; flex: 0 0 auto; }
  .sw.on { background: var(--link); }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .sw.on::after { left: 18px; }

  /* ===== Calendar body (side legend + grid) ===== */
  .cal-body { display: flex; min-height: 540px; }
  .cal-side { width: 250px; flex: 0 0 250px; border-right: 1px solid var(--border); padding: 6px 0; }
  .lg-title { font-size: 13px; font-weight: 700; color: var(--text); padding: 10px 16px 6px; }
  .lg-row { display: flex; align-items: center; gap: 10px; padding: 7px 16px; font-size: 13px; color: var(--text2); cursor: default; }
  .lg-row:hover { background: var(--hover); }
  .lg-sw { width: 13px; height: 13px; border-radius: 3px; flex: 0 0 auto; }
  .lg-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lg-divider { height: 1px; background: var(--border); margin: 8px 0; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 16px 10px; }
  .tag-pill { font-size: 11px; color: var(--label); border: 1px solid var(--border2); border-radius: 12px; padding: 2px 9px; }

  /* ===== Calendar grid ===== */
  .cal-grid { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .gut { width: 52px; flex: 0 0 52px; }
  .cal-colhead { display: flex; border-bottom: 1px solid var(--border); }
  .cal-colhead .gut { border-right: 1px solid var(--border); }
  .cal-colhead-track { flex: 1; display: flex; }
  .colhead-cell { flex: 1; text-align: center; padding: 8px 0; border-right: 1px solid var(--border); }
  .colhead-cell:last-child { border-right: none; }
  .colhead-cell.weekend { background: var(--weekend); }
  .colhead-cell .dnum { font-size: 20px; font-weight: 400; color: var(--text); }
  .colhead-cell .dname { font-size: 11px; color: var(--label); text-transform: uppercase; letter-spacing: .4px; }
  .colhead-cell.today .dnum { color: #fff; background: var(--brand); width: 30px; height: 30px; line-height: 30px; border-radius: 50%; display: inline-block; font-size: 15px; }

  .cal-allday { display: flex; border-bottom: 1px solid var(--group-border); background: #fcfcfd; }
  .cal-allday .gut { border-right: 1px solid var(--border); font-size: 10px; color: var(--label); text-transform: uppercase; display: flex; align-items: center; justify-content: center; }
  .cal-allday-track { flex: 1; position: relative; display: flex; }
  .allday-cell { flex: 1; border-right: 1px solid var(--border); }
  .allday-cell:last-child { border-right: none; }
  .allday-cell.weekend { background: var(--weekend); }
  .allday-bars { position: absolute; inset: 0; }
  .allday-bar {
    position: absolute; height: 22px; border-radius: 4px; border-left: 3px solid; font-size: 11px;
    padding: 3px 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text2); cursor: pointer;
  }
  .allday-bar:hover { filter: brightness(0.97); box-shadow: 0 1px 4px rgba(34,54,84,.18); }

  .cal-scroll { max-height: 440px; overflow-y: auto; }
  .cal-hours { display: flex; }
  .cal-gutter { width: 52px; flex: 0 0 52px; border-right: 1px solid var(--border); }
  .cal-gutter .hr { height: 40px; font-size: 11px; color: var(--label); text-align: right; padding-right: 8px; transform: translateY(-6px); }
  .cal-days-track { flex: 1; display: flex; }
  .cal-day {
    flex: 1; position: relative; border-right: 1px solid var(--border);
    background: repeating-linear-gradient(to bottom, transparent 0, transparent 39px, #eef0f2 39px, #eef0f2 40px);
  }
  .cal-day:last-child { border-right: none; }
  .cal-day.weekend { background: var(--weekend); background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 39px, #e8eaec 39px, #e8eaec 40px); }
  .appt {
    position: absolute; left: 3px; right: 3px; border-radius: 5px; border-left: 3px solid; padding: 4px 7px;
    font-size: 11px; overflow: hidden; color: var(--text2); cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  .appt:hover { filter: brightness(0.97); box-shadow: 0 2px 6px rgba(34,54,84,.2); }
  .appt .at { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .appt .as { color: var(--label); font-size: 10px; }

  /* ===== Create Event popover ===== */
  .ce-anchor { position: relative; }
  .ce-pop {
    position: absolute; top: calc(100% + 8px); left: 0; z-index: 70; width: 440px; max-width: 90vw;
    background: #fff; border: 1px solid var(--border2); border-radius: 12px;
    box-shadow: 0 16px 40px rgba(34,54,84,.24); overflow: hidden;
  }
  .ce-head { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .ce-head .t { font-weight: 700; font-size: 16px; color: var(--text); }
  .ce-head .x { margin-left: auto; background: none; border: none; color: var(--label); padding: 4px; border-radius: 6px; display: inline-flex; }
  .ce-head .x:hover { background: var(--hover); }
  .ce-body { padding: 16px; max-height: 62vh; overflow: auto; }
  .ce-foot { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .btn-transparent { background: none; border: none; color: var(--link); font-weight: 600; font-size: 13px; padding: 0 12px; }
  .btn-transparent:hover { text-decoration: underline; }
  .btn-primary:disabled { background: #c6cdd4; cursor: default; }

  .fld { margin-bottom: 14px; }
  .fld:last-child { margin-bottom: 0; }
  .fld > label { display: block; font-size: 12px; color: var(--label); margin-bottom: 5px; }
  .req { color: var(--red); margin-left: 2px; }
  .inp {
    width: 100%; height: 34px; border: 1px solid var(--field-border); border-radius: 6px; padding: 0 10px;
    font-size: 14px; font-family: inherit; color: var(--text2); background: #fff;
  }
  .inp:focus { outline: none; border-color: var(--link); box-shadow: 0 0 0 1px var(--link); }
  select.inp { appearance: none; background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'%3E%3Cpath d='M2 3.5L5 6.5L8 3.5' stroke='%231d2d3e' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 10px center; padding-right: 28px; }
  .dt-row { display: flex; gap: 8px; }
  .dt-row .inp.date { flex: 1; }
  .dt-row .inp.time { width: 104px; flex: 0 0 104px; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; }
  .toggle-row label { font-size: 14px; color: var(--text2); margin: 0; }
  .inp-fixed { background: var(--bg); color: var(--label); cursor: default; font-style: italic; display: flex; align-items: center; justify-content: flex-start; text-align: left; }
  .chips { display: flex; flex-direction: column; gap: 6px; }
  .chip { border: 1px solid var(--field-border); background: #fff; color: var(--text); border-radius: 8px; padding: 7px 12px; font-size: 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
  .chip.on { background: var(--sel-bg); border-color: var(--link); color: var(--link); }
  .chip-label { font-weight: 600; }
  .chip-examples { font-size: 11px; color: var(--label); font-weight: 400; }
  .chip.on .chip-label { color: var(--link); }
  .chip.on .chip-examples { color: var(--link); opacity: 0.8; }

  /* ===== Event detail popover ===== */
  .ev-backdrop { position: fixed; inset: 0; z-index: 80; background: transparent; }
  .ev-pop {
    position: fixed; z-index: 81; width: 320px; max-width: 92vw;
    background: #fff; border: 1px solid var(--border2); border-radius: 12px;
    box-shadow: 0 16px 40px rgba(34,54,84,.28); overflow: hidden;
  }
  .ev-accent { height: 4px; width: 100%; }
  .ev-head { display: flex; align-items: flex-start; gap: 10px; padding: 14px 14px 10px; }
  .ev-head .ev-title { font-weight: 700; font-size: 15px; color: var(--text); line-height: 1.3; }
  .ev-head .x { margin-left: auto; flex: 0 0 auto; background: none; border: none; color: var(--label); padding: 3px; border-radius: 6px; display: inline-flex; }
  .ev-head .x:hover { background: var(--hover); }
  .ev-body { padding: 0 14px 14px; }
  .ev-row { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--border); }
  .ev-row:first-child { border-top: none; }
  .ev-row .ev-ic { flex: 0 0 18px; color: var(--label); margin-top: 1px; }
  .ev-row .ev-k { flex: 0 0 72px; font-size: 12px; color: var(--label); }
  .ev-row .ev-v { flex: 1; font-size: 13px; color: var(--text2); }
  .ev-type { display: inline-flex; align-items: center; gap: 7px; }
  .ev-type .ev-dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
  .ev-cats { display: flex; flex-wrap: wrap; gap: 6px; }
  .ev-cat { font-size: 11px; color: var(--text); background: var(--sel-bg); border: 1px solid #cfe3fb; border-radius: 12px; padding: 2px 9px; }
  .ev-none { color: var(--label); font-style: italic; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useLayoutEffect } = React;

/* ---------------- Icons ---------------- */
const I = {
  search: <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" strokeWidth="1.5"/><path d="M11 11l4 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>,
  caretDown: <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  chevRight: <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3.5L8.5 7L5 10.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  prev: <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  next: <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  plus: <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>,
  filter: <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 3h12l-5 6v4l-2 1V9L2 3z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/></svg>,
  tag: <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 2h5l7 7-5 5-7-7V2z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/><circle cx="5" cy="5" r="1" fill="currentColor"/></svg>,
  ics: <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2.5" y="3.5" width="11" height="10" rx="1.3" stroke="currentColor" strokeWidth="1.3"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>,
  overflow: <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg>,
  close: <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>,
  cart: <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 2h2l1.8 9h8l1.5-6.5H5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/><circle cx="7" cy="15" r="1.1" fill="currentColor"/><circle cx="13" cy="15" r="1.1" fill="currentColor"/></svg>,

];

function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}
function dayIndexFromDate(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const diff = Math.round((d - WEEK_START) / 86400000);
  return Math.max(0, Math.min(6, diff));
}
function timeToHour(t) {
  const [h, m] = (t || "0:00").split(":").map(Number);
  return (h || 0) + (m || 0) / 60;
}
function fmtHour(h) {
  const hh = Math.floor(h) % 24;
  const mm = Math.round((h - Math.floor(h)) * 60);
  return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
}
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DAYNAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function dateFromDayIndex(i) {
  const d = new Date(WEEK_START);
  d.setDate(d.getDate() + i);
  return d;
}
function fmtDay(i) {
  const d = dateFromDayIndex(i);
  return `${DAYNAMES[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}

/* ---------------- Create Event popover ---------------- */
function CreateEventPopover({ onClose, onCreate }) {
  const [name, setName] = useState("");
  const [allDay, setAllDay] = useState(false);
  const [startDate, setStartDate] = useState("2026-12-02");
  const [startTime, setStartTime] = useState("10:00");
  const [endDate, setEndDate] = useState("2026-12-02");
  const [endTime, setEndTime] = useState("12:00");
  const [tags, setTags] = useState([]);

  const toggleTag = (t) => setTags(ts => ts.includes(t) ? ts.filter(x => x !== t) : [...ts, t]);
  const valid = name.trim() && startDate && endDate && (allDay || (startTime && endTime));

  const submit = () => {
    if (!valid) return;
    const ds = dayIndexFromDate(startDate), de = dayIndexFromDate(endDate);
    if (allDay) {
      onCreate({ allDay: true, event: { type: "customer", title: name.trim(), dayStart: ds, dayEnd: Math.max(ds, de), tags } });
    } else {
      let s = timeToHour(startTime), e = timeToHour(endTime);
      if (e <= s) e = Math.min(24, s + 1);
      onCreate({ allDay: false, event: { type: "customer", title: name.trim(), day: ds, start: s, end: e, tags } });
    }
    onClose();
  };

  return (
    <div className="ce-pop" onClick={e => e.stopPropagation()}>
      <div className="ce-head">
        <span className="t">Create event</span>
        <button className="x" onClick={onClose} aria-label="Close">{I.close}</button>
      </div>
      <div className="ce-body">
        <div className="fld">
          <label>Event name<span className="req">*</span></label>
          <input className="inp" value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Q3 Platform Upgrade" autoFocus />
        </div>

        <div className="fld toggle-row">
          <label>All-day event</label>
          <button className={"sw" + (allDay ? " on" : "")} role="switch" aria-checked={allDay} aria-label="All-day event" onClick={() => setAllDay(a => !a)} />
        </div>

        <div className="fld">
          <label>Starts<span className="req">*</span></label>
          <div className="dt-row">
            <input className="inp date" type="date" value={startDate} onChange={e => setStartDate(e.target.value)} />
            {!allDay && <input className="inp time" type="time" value={startTime} onChange={e => setStartTime(e.target.value)} />}
          </div>
        </div>

        <div className="fld">
          <label>Ends<span className="req">*</span></label>
          <div className="dt-row">
            <input className="inp date" type="date" value={endDate} onChange={e => setEndDate(e.target.value)} />
            {!allDay && <input className="inp time" type="time" value={endTime} onChange={e => setEndTime(e.target.value)} />}
          </div>
        </div>

        <div className="fld">
          <label>Event type</label>
          <div className="inp inp-fixed">Customer specific event</div>
        </div>

        <div className="fld">
          <label>Event category</label>
          <div className="chips">
            {CUSTOMER_EVENT_TYPES.map(t => (
              <button key={t.label} className={"chip" + (tags.includes(t.label) ? " on" : "")} onClick={() => toggleTag(t.label)}>
                <span className="chip-label">{t.label}</span>
                <span className="chip-examples">{t.examples}</span>
              </button>
            ))}
          </div>
        </div>
      </div>
      <div className="ce-foot">
        <button className="btn-primary" disabled={!valid} onClick={submit}>Create event</button>
        <button className="btn-transparent" onClick={onClose}>Cancel</button>
      </div>
    </div>
  );
}

/* ---------------- Event detail popover ---------------- */
function EventDetailPopover({ event, anchorRect, onClose }) {
  const ref = useRef(null);
  const [pos, setPos] = useState({ top: -9999, left: -9999 });
  const color = typeColor(event.type);
  const typeLabel = (EVENT_TYPES.find(t => t.key === event.type) || {}).label || "Event";
  const allDay = event.dayStart !== undefined;
  const cats = event.tags || [];

  useLayoutEffect(() => {
    const el = ref.current;
    if (!el || !anchorRect) return;
    const pad = 8, w = el.offsetWidth, h = el.offsetHeight;
    const vw = window.innerWidth, vh = window.innerHeight;
    let left = anchorRect.left + anchorRect.width / 2 - w / 2;
    left = Math.max(pad, Math.min(left, vw - w - pad));
    let top = anchorRect.bottom + pad;
    if (top + h > vh - pad) top = anchorRect.top - h - pad;
    if (top < pad) top = Math.max(pad, vh - h - pad);
    setPos({ top, left });
  }, [anchorRect]);

  useEffect(() => {
    const onKey = e => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [onClose]);

  return (
    <>
      <div className="ev-backdrop" onClick={onClose} />
      <div ref={ref} className="ev-pop" role="dialog" aria-label={"Event details: " + event.title}
        style={{ top: pos.top, left: pos.left }}>
        <div className="ev-accent" style={{ background: color }} />
        <div className="ev-head">
          <span className="ev-title">{event.title}</span>
          <button className="x" onClick={onClose} aria-label="Close">{I.close}</button>
        </div>
        <div className="ev-body">
          <div className="ev-row">
            <span className="ev-ic">{I.dotgrid}</span>
            <span className="ev-k">Type</span>
            <span className="ev-v">
              <span className="ev-type"><span className="ev-dot" style={{ background: color }} />{typeLabel}</span>
            </span>
          </div>
          <div className="ev-row">
            <span className="ev-ic">{I.cal}</span>
            <span className="ev-k">Date</span>
            <span className="ev-v">
              {allDay
                ? (event.dayStart === event.dayEnd
                    ? fmtDay(event.dayStart)
                    : fmtDay(event.dayStart) + " – " + fmtDay(event.dayEnd))
                : fmtDay(event.day)}
            </span>
          </div>
          <div className="ev-row">
            <span className="ev-ic">{I.clock}</span>
            <span className="ev-k">Time</span>
            <span className="ev-v">
              {allDay ? "All day" : fmtHour(event.start) + " – " + fmtHour(event.end)}
            </span>
          </div>
          <div className="ev-row">
            <span className="ev-ic">{I.tag}</span>
            <span className="ev-k">Categories</span>
            <span className="ev-v">
              {cats.length
                ? <span className="ev-cats">{cats.map(c => <span className="ev-cat" key={c}>{c}</span>)}</span>
                : <span className="ev-none">None</span>}
            </span>
          </div>
        </div>
      </div>
    </>
  );
}

/* ---------------- Calendar grid ---------------- */
function CalendarGrid({ allDayEvents, timedEvents, onSelect }) {
  const alldayHeight = allDayEvents.length * BAR_H + ALLDAY_PAD * 2;
  return (
    <div className="cal-grid">
      {/* column headers */}
      <div className="cal-colhead">
        <div className="gut" />
        <div className="cal-colhead-track">
          {WEEK.map((w, i) => (
            <div key={i} className={"colhead-cell" + (w.weekend ? " weekend" : "")}>
              <div className="dnum">{w.n}</div>
              <div className="dname">{w.d}</div>
            </div>
          ))}
        </div>
      </div>

      {/* all-day row */}
      <div className="cal-allday" style={{ minHeight: Math.max(34, alldayHeight) }}>
        <div className="gut">All-day</div>
        <div className="cal-allday-track">
          {WEEK.map((w, i) => <div key={i} className={"allday-cell" + (w.weekend ? " weekend" : "")} />)}
          <div className="allday-bars">
            {allDayEvents.map((e, lane) => {
              const span = e.dayEnd - e.dayStart + 1;
              return (
                <div key={e.id} className="allday-bar" title={e.title}
                  onClick={ev => onSelect(e, ev.currentTarget.getBoundingClientRect())}
                  style={{
                    left: `calc(${(e.dayStart / 7) * 100}% + 3px)`,
                    width: `calc(${(span / 7) * 100}% - 6px)`,
                    top: ALLDAY_PAD + lane * BAR_H,
                    background: rgba(typeColor(e.type), 0.18),
                    borderLeftColor: typeColor(e.type),
                  }}>
                  {e.title}
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* hourly grid */}
      <div className="cal-scroll">
        <div className="cal-hours">
          <div className="cal-gutter">
            {Array.from({ length: 24 }, (_, h) => (
              <div key={h} className="hr">{h === 0 ? "" : String(h).padStart(2, "0") + ":00"}</div>
            ))}
          </div>
          <div className="cal-days-track">
            {WEEK.map((w, di) => (
              <div key={di} className={"cal-day" + (w.weekend ? " weekend" : "")} style={{ height: 24 * HOUR_H }}>
                {timedEvents.filter(e => e.day === di).map(e => (
                  <div key={e.id} className="appt" title={e.title}
                    onClick={ev => onSelect(e, ev.currentTarget.getBoundingClientRect())}
                    style={{
                      top: e.start * HOUR_H,
                      height: Math.max(22, (e.end - e.start) * HOUR_H - 2),
                      background: rgba(typeColor(e.type), 0.18),
                      borderLeftColor: typeColor(e.type),
                    }}>
                    <span className="at">{e.title}</span>
                    <span className="as">{fmtHour(e.start)}–{fmtHour(e.end)}</span>
                  </div>
                ))}
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

            <div className="tabs">
              {TABS.map(t => (
                <button key={t} className={"tab " + (tab === t ? "active" : "")} onClick={() => setTab(t)}>{t}</button>
              ))}
            </div>
          </div>
          <CalendarPage />
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
